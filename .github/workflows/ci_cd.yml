name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 52.62.121.214
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}

          script: |
            source ~/.bashrc || true

            export PATH=$PATH:/home/ubuntu/.local/share/pnpm

            cd ~/Duodle

            git fetch origin
            git reset --hard origin/main

            pnpm install
            pnpm build

            pm2 restart all --update-env
            pm2 save
